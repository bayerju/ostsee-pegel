name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: node --test scripts/deploy-production.test.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Build and check application
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ostsee-pegel:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime against a disposable database
        run: node scripts/smoke-image.mjs ostsee-pegel:test
